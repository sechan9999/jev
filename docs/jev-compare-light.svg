<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-label="JEV comparison: generation lane loops token-by-token then parses text; scoring lane runs the model once, reads A/B/C logits, applies softmax over three values, and returns a probability distribution. Both reach the same decision.">
  <style>
    svg{color:#1c2230;}
    text{font-family:'Segoe UI','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;}
    .canvas{fill:#ffffff;stroke:#e2e5ea;stroke-width:1;}
    .box{fill:#ffffff;stroke:#c4cad3;stroke-width:1.6;}
    .box.accent{stroke:#0f6f66;}
    .box.shared{fill:#f0f2f5;}
    .flow{fill:none;stroke:#c4cad3;stroke-width:1.8;}
    .flow.accent{stroke:#0f6f66;}
    .loop{fill:none;stroke:#8a5a2b;stroke-width:1.8;}
    .lbl{fill:#1c2230;}
    .lbl.mut{fill:#5b6472;}
    .lbl.accent{fill:#0f6f66;}
    .lbl.warm{fill:#8a5a2b;}
    .mono{font-family:'SFMono-Regular','Consolas','Liberation Mono',monospace;}
    .lane-title{fill:#1c2230;font-weight:600;}
    .lane-title.accent{fill:#0f6f66;}
    .ah{fill:#c4cad3;}
    .ah.accent{fill:#0f6f66;}
    .ah.warm{fill:#8a5a2b;}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse">
      <path class="ah" d="M0,0 L9,4.5 L0,9 Z"/>
    </marker>
    <marker id="arrowA" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse">
      <path class="ah accent" d="M0,0 L9,4.5 L0,9 Z"/>
    </marker>
    <marker id="arrowW" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path class="ah warm" d="M0,0 L9,4.5 L0,9 Z"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="998" height="468" rx="14" class="canvas"/>

  <text class="lane-title warm" x="26" y="46" font-size="15">생성 방식</text>
  <text class="lbl mut" x="26" y="64" font-size="11">답을 글자로 써서 읽어냄</text>
  <text class="lane-title accent" x="26" y="356" font-size="15">점수 방식 · JEV</text>
  <text class="lbl mut" x="26" y="374" font-size="11">후보에 점수만 매김</text>

  <rect class="box shared" x="26" y="224" width="140" height="74" rx="9"/>
  <text class="lbl mut" x="96" y="248" font-size="11" text-anchor="middle">입력</text>
  <text class="lbl" x="96" y="268" font-size="14" text-anchor="middle">질문 + 후보</text>
  <text class="lbl mono" x="96" y="287" font-size="12" text-anchor="middle">A · B · C</text>

  <rect class="box shared" x="846" y="224" width="128" height="74" rx="9"/>
  <text class="lbl mut" x="910" y="250" font-size="11" text-anchor="middle">결정</text>
  <text class="lbl" x="910" y="276" font-size="17" text-anchor="middle" font-weight="600">결제</text>

  <rect class="box" x="192" y="90" width="104" height="60" rx="9"/>
  <text class="lbl" x="244" y="125" font-size="14" text-anchor="middle">모델</text>

  <rect class="box" x="326" y="86" width="198" height="68" rx="9"/>
  <text class="lbl" x="425" y="115" font-size="13" text-anchor="middle">토큰 한 개씩 생성</text>
  <text class="lbl mono mut" x="425" y="136" font-size="11" text-anchor="middle">{ "team": "billing" }</text>

  <rect class="box" x="554" y="90" width="116" height="60" rx="9"/>
  <text class="lbl" x="612" y="125" font-size="14" text-anchor="middle">텍스트 출력</text>

  <rect class="box" x="700" y="90" width="104" height="60" rx="9"/>
  <text class="lbl" x="752" y="125" font-size="14" text-anchor="middle">파싱</text>

  <path class="loop" d="M382,86 C382,50 468,50 468,86" marker-end="url(#arrowW)"/>
  <text class="lbl warm" x="425" y="44" font-size="11" text-anchor="middle">토큰마다 반복 · 가장 느린 구간</text>

  <polyline class="flow" points="166,244 179,244 179,120 192,120" marker-end="url(#arrow)"/>
  <polyline class="flow" points="296,120 326,120" marker-end="url(#arrow)"/>
  <polyline class="flow" points="524,120 554,120" marker-end="url(#arrow)"/>
  <polyline class="flow" points="670,120 700,120" marker-end="url(#arrow)"/>
  <polyline class="flow" points="804,120 828,120 828,244 846,244" marker-end="url(#arrow)"/>

  <rect class="box accent" x="192" y="370" width="104" height="60" rx="9"/>
  <text class="lbl accent" x="244" y="400" font-size="14" text-anchor="middle">모델 · 1회</text>
  <text class="lbl mut" x="244" y="417" font-size="10.5" text-anchor="middle">생성 없음</text>

  <rect class="box accent" x="326" y="370" width="150" height="60" rx="9"/>
  <text class="lbl accent" x="401" y="405" font-size="13.5" text-anchor="middle">A·B·C 로짓 읽기</text>

  <rect class="box accent" x="506" y="370" width="146" height="60" rx="9"/>
  <text class="lbl accent" x="579" y="400" font-size="13.5" text-anchor="middle">softmax</text>
  <text class="lbl mut" x="579" y="417" font-size="10.5" text-anchor="middle">세 값에만 적용</text>

  <rect class="box accent" x="682" y="368" width="150" height="64" rx="9"/>
  <text class="lbl accent" x="757" y="394" font-size="13.5" text-anchor="middle">확률 분포</text>
  <text class="lbl mono mut" x="757" y="414" font-size="11" text-anchor="middle">0.91 / 0.06 / 0.03</text>

  <polyline class="flow accent" points="166,278 179,278 179,400 192,400" marker-end="url(#arrowA)"/>
  <polyline class="flow accent" points="296,400 326,400" marker-end="url(#arrowA)"/>
  <polyline class="flow accent" points="476,400 506,400" marker-end="url(#arrowA)"/>
  <polyline class="flow accent" points="652,400 682,400" marker-end="url(#arrowA)"/>
  <polyline class="flow accent" points="832,400 850,400 850,298" marker-end="url(#arrowA)"/>
</svg>
