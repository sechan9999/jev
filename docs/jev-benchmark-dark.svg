<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400" role="img" aria-label="Benchmark bar chart. Latency in milliseconds (lower is better): median jev 38.4 vs llm 210.6; mean jev 41.7 vs llm 233.1; p95 jev 58.9 vs llm 402.7 — scoring is about 5.5x faster at the median. Accuracy: jev 92% vs llm 88%. Illustrative example numbers.">
